<ui5-button
	class="border-none"
	id="languageButton"
	end-icon="navigation-down-arrow"
	(click)="languageMenu()">
	{{ selectedLanguageCode.toUpperCase() }}</ui5-button
>

<ui5-menu
	id="menu"
	#menu
	opener="languageButton"
	(item-click)="onMenuItemSelect($event)">
	<ui5-menu-item
		*ngFor="let language of selectedLanguage"
		[text]="language?.name"
		[selected]="selectedLanguageCode === language?.code"></ui5-menu-item>
</ui5-menu>
