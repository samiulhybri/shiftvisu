<ui5-card class="h-[calc(100vh-375px)]">
	<div class="h-[calc(100vh-400px)]">
		<app-grid-table
			headerTitle="Immediate Actions List"
			i18n-headerTitle
			url="/EightDReportActions"
			[filterQuery]="filterQuery"
			expandQuery="$expand=responsible"
			[isBusy]="immediateActionGrid?.isBusy || isSaving"
			[columns]="columns"
			[customData]="eightDReportId == 0"
			[showAction]="true"
			[showSearch]="true"
			[showDownload]="false"
			[showActiveButton]="false"
			addButtonText="New"
			i18n-addButtonText
			[showNewButton]="true"
			[addButtonDisable]="!eightDReportId"
			selectionMode="Single"
			[enableServerSideFiltering]="false"
			(newButtonClick)="newButtonClick()"
			(deleteClick)="deleteClick($event)"
			(editClick)="editClick($event)"
			keyForCacheCustomDataTableColumns="immediateAction"
			#immediateActionRef></app-grid-table>
	</div>
</ui5-card>

<app-eight-d-task-form
	[open]="isTaskSaveDialogOpen"
	*ngIf="isTaskSaveDialogOpen"
	[saveMode]="saveMode"
	[areActionsDisabled]="isSavingTask"
	[descriptionName]="'Immediate Action Description'"
	i18n-descriptionName
	[task]="selectedTask"
	(onPopupSave)="taskPopupSave($event)"
	(onPopupClose)="taskPopupClose($event)"></app-eight-d-task-form>

<ui5-dialog
	header-text="Description"
	[open]="isDescriptionModal"
	state="None"
	i18n-header-text>
	<div class="h-full">
		<app-text-editor
			[notes]="description"
			[isReadOnly]="true"
			style="width: 100%; height: 100%">
		</app-text-editor>
	</div>
	<div
		slot="footer"
		class="footer-style gap-8">
		<ui5-button
			id="deleteCloseButton"
			(click)="closeDialog('description')"
			>{{ localization.close }}</ui5-button
		>
	</div>
</ui5-dialog>

<ui5-dialog
	#deleteTaskDialog
	i18n-header-text
	header-text="Warning"
	state="Critical"
	[open]="deleteId != null">
	<p i18n>Do you really want to delete this task?</p>
	<div
		slot="footer"
		class="footer-style gap-8">
		<ui5-button
			class="dialogSubmit"
			design="Emphasized"
			(click)="deleteTask()"
			[disabled]="isSavingTask"
			>{{ localization.yes }}</ui5-button
		>
		<ui5-button
			design="Transparent"
			[disabled]="isSavingTask"
			(click)="closeDialog('delete')"
			>{{ localization.cancel }}</ui5-button
		>
	</div>
</ui5-dialog>
