<div class="standardTable" style="height: 99%;">
	<app-grid-table
	headerTitle="Planned Order"
	url="/ProdOrderPos"
	i18n-headerTitle
	[columns]="columns"
	[showAction]="false"
	[showDownload]="false"
	[showNewButton]="false"
	[showSearch]="true"
	selectionMode="Single"
	[isBaseVisu]="true"
	[showTableSettingBtn]="false"
	[filterQuery]="query"
	[enableServerSideFiltering]="true"
	sortBy="release_date"
	[onDoubleClick]="handleRowDoubleClick"
	#childComponentRef>
	</app-grid-table>
</div>
<ui5-dialog
	id="viewDialog"
	class="dialog-width"
	[open]="isViewDialogOpen"
	style="height: 80vh; overflow-y: auto;"
	(beforeClose)="closeDialog()">
	<div
		slot="header"
		class="w-100">
		<div style="margin-left: -10px;">
			<ui5-title
				class="pb-2 pt-2"
				level="H5"
				i18n
				>Repair Types</ui5-title
			>
		</div>
	</div>
	<div style="margin-left: -16px; margin-right: -16px; padding: 0 10px;">
		<ui5-busy-indicator
			#isTypeOfRepairLoadingView
			[active]="isTypeOfRepairLoading"
			size="L"
			style="width: 100%;"
			>
			<div style="width: 100%;  display: flex; flex-direction: column;" class="md:h-[57vh] lg:h-[60vh] xl:h-[62vh]   xxl:h-[67vh]">
				<div class="tree-table"[ngStyle]="{ 'height': isOtherRepairTableTableShow ? '50%' : '100%' }"  *ngIf="isTreeTableShow">
					<app-repair-tree #treeComponent [dataChangeTrigger]="typeOfRepairTreeTableData" [showTableSearch]="false" [minRows]="minRows" selectionMode="None" [columns]="treeViewcolumns" subRowsKey="operationPlanPos" [data]="typeOfRepairTreeTableData" [tableTitle]="tableTitle"></app-repair-tree>
				</div>
				<div class="tableStandard_repair" [ngStyle]="{ 'height': isTreeTableShow ? '50%' : '100%' }" *ngIf="isOtherRepairTableTableShow">
				<app-grid-table headerTitle="Other Repair" i18n-headerTitle
					[data]="otherRepairTableData" [customData]="true" [columns]="otherRepairColumns"
					[showSearch]="false" [showDownload]="false" [editPermission]="false"
					addButtonText="Add" i18n-addButtonText
					selectionMode="None" [showAction]="false"
					#childComponentRefOtherRepairTable>
				</app-grid-table>
				</div>
			</div>
		</ui5-busy-indicator>
	</div>
	<div
		slot="footer"
		class="dialog-footer">
		<ui5-button
			(click)="closeDialog()"
			id="closeButton"
			design="Default">
			{{ localization.close }}</ui5-button>
	</div>
</ui5-dialog>
<ui5-dialog
	id="viewAttachmentDialog"
	class="custom-width"
	[open]="isAttachmentDialogOpen"
	(beforeClose)="closeAttachmentDialog()">
	<div
		slot="header"
		class="w-100">
		<div>
			<ui5-title
				class="pb-2 pt-2"
				level="H5"
				i18n
				>Attachment</ui5-title
			>
		</div>
	</div>
	<ui5-busy-indicator
		[active]="isLoading"
		size="L"
		class="w-full">
		<div class="w-full form">
			<app-file-preview [model]="'ProdOrderPos'" [modelId]="itemId" [filePreviewHeight]="filePreviewHeight"></app-file-preview>
		</div>
	</ui5-busy-indicator>
	<div
		slot="footer"
		class="dialog-footer">
		<ui5-button
			(click)="closeAttachmentDialog()"
			id="closeButton"
			design="Default">
			{{ localization.close }}</ui5-button>
	</div>
</ui5-dialog>
<div *ngIf="isEditDialogOpen">
	<app-repair-details
		[modalType]="hasAuth ? 'edit' : 'view'"
		[modalHeight]="'92%'"
		[selectedProdOrderPos]="selectedActiveRepair"
		[repairId]="selectedActiveRepair?.id || 0"
		[selectedNewOtherRepairOp]="otherRepairList"
		[allUserList]="userList"
		[allSupplierList]="supplierList"
		[isDialogOpen]="isEditDialogOpen"
		[allRepairTypeList]="allOperationPlanList"
		[isPlannedOrder]="hasAuth ? true : false"
		(isCloseClicked)="closeUpdateDialog()"
		(isSaveClicked)="isSavedModal()"
		#repairDetailsTable>
	</app-repair-details>
</div>

<ui5-dialog
		#deleteModal
		id="deleteDialogShift"
		header-text="Warning"
		[open]="idDeleteModalOpen"
		state="Critical"
		i18n-header-text
		(beforeClose)="closeDialog('delete')">
		<p>{{ localization.doYouWantToDeleteThisRecord }}</p>
		<ui5-busy-indicator
			[active]="isLoading"
			size="M">
		</ui5-busy-indicator>
		<div
			slot="footer"
			class="footer-style gap-8">
			<ui5-button
				class="dialogSubmit"
				design="Emphasized"
				(click)="DeleteThisOrder()"
				id="deleteSubmitButton"
				>{{ localization.ok }}</ui5-button
			>
			<ui5-button
				id="deleteCloseButton"
				(click)="closeDialog('delete')"
				>{{ localization.close }}</ui5-button
			>
		</div>
</ui5-dialog>
<ui5-dialog
		#remarkModal
		header-text="Remarks"
		class="h-[88vh] custom-width"
		[open]="isRemarkModal"
		state="None"
		i18n-header-text
		(beforeClose)="closeDialog('remark')">
		<div class="h-full">
			<app-text-editor [notes]="orderNote"
			[isReadOnly]="true"
			style="width: 100%; height: 100%;">
		</app-text-editor>
		</div>
		<div
			slot="footer"
			class="footer-style gap-8">
			
			<ui5-button
				id="deleteCloseButton"
				(click)="closeDialog('remark')"
				>{{ localization.close }}</ui5-button
			>
		</div>
</ui5-dialog>
