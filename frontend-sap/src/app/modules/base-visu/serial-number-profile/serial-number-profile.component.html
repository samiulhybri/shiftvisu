<app-grid-table
	headerTitle="Serial Number Profiles"
	url="/SerialNumberProfiles"
	i18n-headerTitle
	[showRowDataCount]="true"
	[columns]="column"
	[showAction]="true"
	[showSearch]="true"
	[showDownload]="false"
	[showActiveButton]="false"
	addButtonText="New"
	i18n-addButtonText
	[isBaseVisu]="true"
	[enableServerSideFiltering]="true"
	[showNewButton]="true"
    (newButtonClick)="newButtonClick()"
	[editPermission]="authService.isPermissionValid('BASEVISU_SERIAL_NUMBER_PROFILE_EDIT')"
	(deleteClick)="deleteClick($event)"
	(editClick)="editClick($event)"
	selectionMode="Single"
	#childComponentRef>
</app-grid-table>
<app-dialog
	id="addGroupDialog"
	[isDialogOpen]="isDialogOpen"
	(onBeforeClose)="closeDialog()"
	[title]="dialogTitle">
	<ui5-busy-indicator
		[active]="isLoading"
		size="L">
		<div
			class="form w-[418px] h-full"
			*ngIf="selectedSerialNumberProfile">
			<form
			(ngSubmit)="onSubmit(createOrUpdateForm)"
			#createOrUpdateForm="ngForm">
				<div class="flex">
					<div class="flex flex-col">
						<ui5-label show-colon i18n>Check Stock</ui5-label>
						<ui5-switch
							[(ngModel)]="selectedSerialNumberProfile.check_stock"
							name="check_stock"
							id="check_stock"></ui5-switch>
					</div>
				</div>
				<div class="w-full">
					<div class="flex-col gap-[5px] mt-2">
						<ui5-label
							show-colon
							required
							>{{ localization.id }}</ui5-label
						>
						<ui5-busy-indicator
							[active]="isLoadingCustomId"
							size="S">
							<ui5-input
								#customId="ngModel"
								[(ngModel)]="selectedSerialNumberProfile.custom_id"
								[valueState]="
									customId.valid == false &&
									(customId.touched || createOrUpdateForm.submitted)
										? 'Negative'
										: customIdState
								"
								class="w-full"
								(input)="onChangeCustomId()"
								id="customIdInput"
								[required]="true"
								name="custom_id">
								<div
									slot="valueStateMessage"
									>
									{{ customIdValueStateText }}
								</div>
							</ui5-input>
						</ui5-busy-indicator>
					</div>
				</div>
			</form>
		</div>
	</ui5-busy-indicator>
	<div
		slot="footer"
		class="flex items-center justify-end flex-row w-full">
		<ui5-button
			design="Emphasized"
			(click)="onSave()"
			[disabled]="disableButtonDuringRequest">
			{{ localization.save }}</ui5-button
		>
		<ui5-button
			class="ml-8"
			design="Transparent"
			(click)="closeDialog()">
			{{ localization.close }}</ui5-button
		>
	</div>
</app-dialog>
<ui5-dialog
	id="deleteDialog"
	header-text="Warning"
	state="Critical">
	<p>{{ localization.doYouWantToDeleteThisRecord }}</p>
	<div class="flex flex-col-item">
		<ui5-busy-indicator
			[active]="isLoading"
			size="M">
		</ui5-busy-indicator>
	</div>
	<div
		slot="footer"
		class="footer-style gap-8">
		<ui5-button
			class="dialogSubmit"
			design="Emphasized"
			(click)="deleteSubmit()"
			[disabled]="disableButtonDuringRequest"
			>{{ localization.ok }}</ui5-button
		>
		<ui5-button
			design="Transparent"
			(click)="closeDialogDelete()"
			>{{ localization.close }}</ui5-button
		>
	</div>
</ui5-dialog>
<ui5-dialog
	#errorDialogSerialNumberProfile
	id="errorDialogSerialNumberProfile"
	header-text="Error"
	state="Negative">
	<p>{{ localization.someThingWentWrong }}</p>
	<div class="flex flex-col-item">
		<ui5-busy-indicator
			[active]="isLoading"
			size="M">
		</ui5-busy-indicator>
	</div>
	<div
		slot="footer"
		class="footer-style gap-8">
		<ui5-button
			design="Transparent"
			(click)="closeErrorDialog()"
			>{{ localization.close }}</ui5-button
		>
	</div>
</ui5-dialog>
