<div class="w-100 flex justify-center">
	<ui5-bar class="mt-[10px] w-[99%]">
		<app-general [divHeight]="'hide'" (planvisuGeneralSectionLoaded)="handleCustomerData($event)"></app-general>
		<ui5-input *ngIf= "isCustomer"
			id="customerInput"
			placeholder="Select Customer"
			name="customer"
			[value]="valueForCustomer"
			(change)="onChangeCustomer($event)"
			i18n-placeholder>
				<ui5-icon id="valueHelpIcon"
				class="cursor-pointer"
				slot="icon"
				name="value-help"
				(click)="valueHelperIconClick(valueHelperType.CUSTOMER)"></ui5-icon>
		</ui5-input>
		<ui5-multi-combobox [hidden]="!isShowHall"
			#hallRef
			id="hallMultiComboBox"
			(selectionChange)="selectHall($event)"
			placeholder="Select Hall"
			i18n-placeholder
			class="multi-combobox">
			<ui5-mcb-item
				*ngFor="let hall of halls"
				selected="{{ hall.isSelected }}"
				text="{{ hall.custom_id }} - {{ hall.name }}"
				[id]="hall.id">
			</ui5-mcb-item>
		</ui5-multi-combobox>
		<ui5-multi-combobox [hidden]="!isShowMachineGroup"
			#machineGroupRef
			id="machineGroupMultiComboBox"
			(selectionChange)="selectMachineGroup($event)"
			placeholder="Select Machine Group"
			i18n-placeholder
			class="multi-combobox">
			<ui5-mcb-item
				*ngFor="let machineGroup of machineGroups"
				text="{{ machineGroup.custom_id }} - {{ machineGroup.name }}"
				[id]="machineGroup.id">
			</ui5-mcb-item>
		</ui5-multi-combobox>
		<ui5-multi-combobox [hidden]="!isShowMachine"
			#machineRef
			id="machineMultiComboBox"
			(selectionChange)="selectMachine($event)"
			placeholder="Select Machines"
			i18n-placeholder
			class="multi-combobox">
			<ui5-mcb-item
				*ngFor="let machine of filterMachines"
				text="{{ machine.custom_id }} - {{ machine.name }}"
				[id]="machine.id">
			</ui5-mcb-item>
		</ui5-multi-combobox>
		<ui5-input [hidden]="!isShowItem"
			id="itemInput"
			placeholder="Select Item"
			[required]="true"
			name="customId"
			[value]="valueForItem"
			(change)="onChangeItem($event)"
			i18n-placeholder>
			<ui5-icon
				id="valueHelpIcon"
				class="cursor-pointer"
				slot="icon"
				name="value-help"
				(click)="valueHelperIconClick(valueHelperType.ITEM)"></ui5-icon>
		</ui5-input>
		<ui5-input [hidden]="!isShowProdOrder"
			id="prodOrderInput"
			placeholder="Select Prod Order"
			[required]="true"
			name="customId"
			[value]="valueForProdOrder"
			(change)="onChangeProdOrder($event)"
			i18n-placeholder>
			<ui5-icon
				id="valueHelpIcon"
				class="cursor-pointer"
				slot="icon"
				name="value-help"
				(click)="valueHelperIconClick(valueHelperType.PRODORDER)"></ui5-icon>
		</ui5-input>
		<ui5-daterange-picker
			(change)="changeDate($event)"
			placeholder="Pick Date Range"
			i18n-placeholder
			[value]="
				momentInstance.utc(start).local().format('DD/MM/YYYY') +
				' - ' +
				momentInstance.utc(end).local().format('DD/MM/YYYY')
			"
			formatPattern="dd/MM/YYYY">
		</ui5-daterange-picker>
		<ui5-button
			class=""
			design="Emphasized"
			(click)="onGo()"
			i18n
			[disabled]="isBusy"
			>Go</ui5-button
		>
		<ui5-button
			class=""
			design="Emphasized"
			(click)="onReset()"
			i18n
			[disabled]="isBusy"
			>Reset</ui5-button
		>
		<div class="flex flex-row items-center">
			<ui5-label
				show-colon
				i18n
				>Hide Proposed</ui5-label
			>
			<ui5-switch
				id="proposedSwitch"
				[checked]="isShowProposedData"
				[disabled]="isBusy"
				(change)="onChangeProdOrderStatus()">
			</ui5-switch>
		</div>
	</ui5-bar>
</div>

<div
	style="height: calc(100% - 70px)"
	class="ml-[10px] mb-[10px] mt-[10px]">
	<bryntum-scheduler-pro-project-model
		#project
		[autoLoad]="projectProps.autoLoad!"
		[loadUrl]="projectProps.loadUrl!"
		[resourceStore]="projectProps.resourceStore!"
		[eventStore]="projectProps.eventStore!"
		[validateResponse]="projectProps.validateResponse!">
	</bryntum-scheduler-pro-project-model>

	<div
		id="content"
		class="b-side-by-side relative"
		(touchstart)="touchStart($event)">
		<ui5-busy-indicator
			class="h-full w-full"
			[active]="!isEverythingLoaded || isBusy">
			<bryntum-scheduler-pro
				#schedulerPro
				[project]="project"
				[startDate]="schedulerProProps.startDate!"
				[rowHeight]="30"
				[barMargin]="2"
				[endDate]="schedulerProProps.endDate!"
				[viewPreset]="schedulerProProps.viewPreset!"
				[columns]="schedulerProProps.columns!"
				[allowOverlap]="true"
				[tbar]="schedulerProProps.tbar!"
				(onCellDblClick)="onCellDoubleClick($event)"
				eventStyle="border"
				[presets]="presets"
				[useInitialAnimation]="schedulerProProps.useInitialAnimation!"
				[stripeFeature]="true"
				[columnLinesFeature]="schedulerProProps.columnLinesFeature!"
				[filterBarFeature]="schedulerProProps.filterBarFeature!"
				[calendarHighlightFeature]="schedulerProProps.calendarHighlightFeature!"
				[eventMenuFeature]="eventMenuFeature!"
				[eventDragFeature]="schedulerProProps.eventDragFeature!"
				[taskEditFeature]="false"
				[allowCreate]="false"
				[eventTooltipFeature]="false"
				[scheduleTooltipFeature]="false"
				[createEventOnDblClick]="false"
				[sortFeature]="true"
				[dependenciesFeature]="dependenciesFeatures"
				[eventRenderer]="eventRenderer.bind(this)"
				[timeRangesFeature]="{ showCurrentTimeLine: true }"
				[eventDragCreateFeature]="false"
				(onEventDrag)="eventDrag($event)"
				(onEventDragStart)="eventDragStart($event)"
				(onEventDrop)="eventDrop($event)"
				(onSplit)="onSplit()"
				(onEventDblClick)="editDialogOpen($event)"
				(onEventClick)="onEventClick($event)"
				(onSelectionChange)="onSchedulerSelectionChange()"
				(onTimeAxisChange)="timeAxisChange$.next($event)"
				(onAfterEventDrop)="onAfterEventDrop()"
				(onEventMouseEnter)="onEventMouseEnter($event)"
                (onEventMouseLeave)="onEventMouseLeave()"
                >
			</bryntum-scheduler-pro>
		</ui5-busy-indicator>
		
		<ng-container *ngIf="colorSchemeList && colorSchemeList.length > 0; else basicLegendsTemplete"> 
			<div class="absolute top-[27px] left-[200px] z-50 flex flex-row">
				<div *ngFor="let base of colorSchemeList" class="flex items-center ml-[10px]">
					<div 
						class="h-[16px] w-[20px]" 
						[ngStyle]="{
							'background-color': formatColor(base, 'background'),
							'border': formatColor(base, 'border')
						}">
					</div>
					<ui5-label i18n class="ml-[10px] mr-[10px]">{{ base.value_string }}</ui5-label>
				</div>
			</div>
		</ng-container>
		<ng-template #basicLegendsTemplete>
			<div class="absolute top-[27px] left-[200px] z-50 flex flex-row">
				<div
					class="h-20px w-[20px] ml-[10px]"
					style="background-color: #707070"></div>
				<ui5-label
					i18n
					class="ml-[10px] mr-[10px]">Proposed</ui5-label>
				<div
					class="h-20px w-[20px] ml-[10px]"
					style="background-color: #ff8d69"></div>
				<ui5-label
					i18n
					class="ml-[10px] mr-[10px]">Planned</ui5-label>
				<div
					class="h-20px bg-blue-400 w-[20px] ml-[10px]"
					style="background-color: #0b77cf"></div>

				<ui5-label
					i18n
					class="ml-[10px] mr-[10px]">Released</ui5-label>
				<div
					class="h-20px w-[20px] ml-[10px]"
					style="background-color: #cd7a00"></div>
				<ui5-label
					i18n
					class="ml-[10px] mr-[10px]">In Setup</ui5-label>
				<div
					class="h-20px w-[20px] ml-[10px]"
					style="background-color: #b5deb7"></div>
				<ui5-label
					i18n
					class="ml-[10px] mr-[10px]">In Production</ui5-label>
				<div
					class="h-20px w-[20px] ml-[10px]"
					style="background-color: #d4ad02"></div>
				<ui5-label
					i18n
					class="ml-[10px] mr-[10px]">Suspended</ui5-label>
				<div
					class="h-20px w-[20px] ml-[10px]"
					style="border: 2px solid red"></div>
				<ui5-label
					i18n
					class="ml-[10px]">Restrictions</ui5-label>
			</div>
		</ng-template>
	</div>
</div>

     <app-order-details-dialog
         #orderDetailsDialog
         [open]="isDialogOpen"
		 [showfields]="isShowOperationPopupField"
         [isSaveButton]="isSaveButton"
         [isPlanVisuGanttRestrictionRemove]="isPlanVisuGanttRestrictionRemove"
         [isEndBusy]="isEndBusy"
         [isDialogEditable]="isDialogEditable"
         [isBusy]="isBusy"
         [isStatusChanged]="isStatusChanged"
         [selectedOperation]="selectedOperation"
         [opeartionMachines]="opeartionMachines"
         [operationEnd]="operationEnd ?? ''"
         [operationStart]="operationStart"
         [selecteItem]="selecteItem"
         [prodOrderPosOperationStatusData]="prodOrderPosOperationStatusData"
         [dialogTitle]="dialogTitle || ''"
         [isToolPreparedForRelease]="isToolPreparedForRelease"
         (changeIsDialogOpen)="closeDialog()"
         (changeMachine)="onChangeMachine($event)"
         (machineInputChange)="onMachineInputChange($event)"
         (changeStartDate)="onChangeStartDate()"
         (statusChange)="onStatusChange($event)"
         (constraintChange)="onConstraintChange($event)"
         (changeTE)="changeTE($event)"
         (changeTool)="onChangeTool($event)"
         (planOperation)="onPlanOperation()"
         (calculateEnd)="calculateEnd()"
         (saveEvent)="onSave()"
         (recalculateOperation)="recalculateOperation()"
         ></app-order-details-dialog>

@if (selectedMachineId) {
	<app-machine-orders-modal
		[machineId]="selectedMachineId"
		[startDate]="start"
		[endDate]="end"
		[showProposed]="!isShowProposedData"
		[closeEvent]="onCloseReScheduleOrderDialog"
		[saveEvent]="onSaveReScheduleOrderDialog"></app-machine-orders-modal>
}

<ui5-dialog
	id="dialog"
	[open]="isValueHelpDialog"
	*ngIf="isValueHelpDialog">
	<ui5-bar
		slot="header"
		class="w-full ml-[-30px]">
		<ui5-title
			level="H5"
			slot="startContent">
			{{ valueHelperTitle }}
		</ui5-title>
	</ui5-bar>
	<div class="h-[620px] w-[450px] mx-4 my-[-16px]">
		<app-grid-table
			[headerTitle]="valueHelperTitle"
			[url]="valueHelperUrl"
			i18n-headerTitle
			[columns]="valueHelperColumns"
			[showAction]="false"
			[showDownload]="false"
			[showActiveButton]="false"
			[showNewButton]="false"
			[isBaseVisu]="false"
			[enableServerSideFiltering]="true"
			[isBaseVisu]="true"
			[showSearch]="true"
			[showTableSettingBtn]="false"
			[expandQuery]="expandedQuery"
			(processData)="processData($event)"
			[sortBy]="valueHelperSortBy"
			[customSortType]="valueHelperSortType"
			[filterQuery]="valueHelperAdditionalFilterQuery"
			selectionMode="Multiple"
			(rowClick)="rowClick($event)"
			#childComponentRef>
		</app-grid-table>
	</div>

	<ui5-toolbar slot="footer">
		<ui5-toolbar-button
			class=""
			design="Emphasized"
			text="Save"
			(click)="onSaveValueHelpDialog()">
		</ui5-toolbar-button>
		<ui5-toolbar-button
			class=""
			design="Transparent"
			text="Cancel"
			(click)="closeValueHelpDialog()">
		</ui5-toolbar-button>
	</ui5-toolbar>
</ui5-dialog>
<ui5-dialog
	[open]="isPlanOrderExportDialogOpen"
	header-text="Confirm"
	i18n-headerText
	(ui5BeforeClose)="closeExportOrder()">
	<div class="flex flex-col align-middle">
		<ui5-text i18n>Are you sure to export the data?</ui5-text>
		<ui5-busy-indicator [active]="isExportBusy"></ui5-busy-indicator>
	</div>
	<ui5-toolbar slot="footer">
		<ui5-toolbar-button
			class=""
			design="Emphasized"
			text="Confirm"
			i18n-text
			(click)="onExportPlanOrder()">
		</ui5-toolbar-button>
		<ui5-toolbar-button
			class=""
			design="Transparent"
			text="Cancel"
			i18n-text
			(click)="closeExportOrder()">
		</ui5-toolbar-button>
	</ui5-toolbar>
</ui5-dialog>
<ui5-toast #toast>{{ toastMessage }}</ui5-toast>
