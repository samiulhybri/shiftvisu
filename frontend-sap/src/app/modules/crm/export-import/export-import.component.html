<div class="content">
    <div  style="height: 100%">
        <header>
            <h3 class="input-group ng-binding" i18n>
               Export/Import
            </h3>
        </header>

      <div style="height: calc(100% - 44px); margin-top: 20px;">
       <div class="flex justify-center mb-2">
        <ui5-busy-indicator class="" [active]="isBusy">
            <div>
                <div class="label gap-2 rounded-xl  custom-shadow flex justify-between" style="align-items: center;">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-2xl bg-[#EAECEE] flex items-center justify-center" >
                            <ui5-icon name="open-folder"></ui5-icon>
                        </div>
                        <span i18n>Excel</span>--&gt; <span i18n>CRM</span>
                    </div>
                    <div class="flex gap-2">
                        <ui5-button (click)="isAttchmentDialogOpen = true" i18n>Upload Files</ui5-button>
                        <ui5-button>{{attachmentCount}}</ui5-button>
                        <ui5-button 
                            (click)="runOperation('import/prod-orders')" 
                            design="Emphasized" 
                            icon="media-play" i18n>
                            Run
                        </ui5-button>
                    </div>   
                </div>
            </div>
        </ui5-busy-indicator>
       </div>
      </div>
    </div>
    
</div>
<ui5-dialog header-text="Files" class="h-[65vh] w-[50vw]" [open]="isAttchmentDialogOpen" state="None"
	i18n-header-text>
	<div class="h-full">
		<app-attachment-upload
		#reuseableAttachmentRef
		[model]="'Customer'"
		[uploadedFiles]="tempFiles"
		[deletedFiles]="deletedSavedFiles"
		[modelId]="selectedCustomer ? selectedCustomer.id : null"
		[checkNewFiles]="checkForNewAttachments"
		[fileCount]="attachmentCount"
		[isShowStandard]="false"
        [isSearchVisible]="false"
        [isDownloadVisible]="false"
        [isCameraVisible]="false"
		[updatedStandardFile]="selectedStandardFile"
		(tempFilesChanged)="onAttachmentChanges($event, 'onUpload')"
		(deletedFilesChanged)="onAttachmentChanges($event, 'onDelete')"
		(newFilesCount)="onAttachmentChanges($event, 'fileCount')"
		style="width: 100%; height: 100%">
</app-attachment-upload>
	</div>
	<div slot="footer" class="footer-style gap-8">
		<ui5-button id="deleteCloseButton" (click)="checkFiles()">{{ localization.save }}</ui5-button>
		<ui5-button id="deleteCloseButton" (click)="isAttchmentDialogOpen = false; tempFiles= []; attachmentCount = 0;">{{ localization.close }}</ui5-button>
	</div>
</ui5-dialog>
<ui5-toast #detailModalToast id="detailModalToast" placement="BottomCenter">{{ toastMessage }}</ui5-toast>
