<div  *ngIf="tableHeight !== 'hide'" [ngStyle]="{'height': tableHeight}">
    <app-grid-table headerTitle="Activity Logs" url="/CustomerCrmActionLogs" i18n-headerTitle [columns]="columns"
        [showAction]="true" [showSearch]="true" [showDownload]="false" [showActiveButton]="false" button1Text="All"
        button2Text="Inactive" button3Text="Active" addButtonText="New" i18n-addButtonText i18n-button1Text i18n-button2Text
        i18n-button3Text  [isBaseVisu]="true" [showNewButton]="true" (newButtonClick)="newButtonClick()"
        [editPermission]="true" (deleteClick)="deleteClick($event)"
		[filterQuery]="filterQuery || ''"
		expandQuery="$expand=crmAction,user,contact"
        (editClick)="editClick($event)" selectionMode="None" #childComponentRef>
    </app-grid-table>
</div>

<app-dialog id="addCrmLogDialog" [isDialogOpen]="isDialogOpen" (onBeforeClose)="closeDialog()" [title]="dialogTitle">
	<ui5-busy-indicator [active]="isLoading" size="L">
		<div class="form w-[418px] h-full" *ngIf="selectedCCActionLog">
			<form (ngSubmit)="onSubmit(createOrUpdateForm)" #createOrUpdateForm="ngForm">
				<div class="w-full">
					<div class="flex-col gap-[5px] mt-2">
						<ui5-label show-colon required i18n>CRM Actions</ui5-label>
						<ui5-combobox id="crmActionsCombobox" class="w-full" #crmActionsCombobox [value]="selectedCCActionLog.crmAction?.name || ''"
							(selection-change)="onChangeCrmAction($event)"
							(change)="inputInvalidEntryRestrict($event, selectedCCActionLog.crmAction?.name)"
							>
							<ui5-cb-item id="{{ crmAction.id }}" *ngFor="let crmAction of crmActions" text="{{ crmAction.name }}"></ui5-cb-item>
						</ui5-combobox>
					</div>
					<div class="flex-col gap-[5px] mt-2">
						<ui5-label show-colon i18n>Note</ui5-label>
						<ui5-textarea
                            [(ngModel)]="selectedCCActionLog.note"
							id="note"
							#noteInput="ngModel"
							class="w-full"
							[rows]="3"
							name="note"></ui5-textarea>
					</div>
				</div>
			</form>
		</div>
	</ui5-busy-indicator>
	<div slot="footer" class="flex items-center justify-end flex-row w-full">
		<ui5-button design="Emphasized" (click)="onSave()" [disabled]="disableButtonDuringRequest">
			{{ localization.save }}</ui5-button>
		<ui5-button class="ml-8" design="Transparent" (click)="closeDialog()">
			{{ localization.close }}</ui5-button>
	</div>
</app-dialog>

<ui5-dialog
	id="deleteDialog"
	header-text="Warning"
	state="Critical">
	<p>{{ localization.doYouWantToDeleteThisRecord }}</p>
	<div class="flex flex-col-item">
		<ui5-busy-indicator
			[active]="isLoading"
			size="M">
		</ui5-busy-indicator>
	</div>
	<div
		slot="footer"
		class="footer-style gap-8">
		<ui5-button
			class="dialogSubmit"
			design="Emphasized"
			(click)="deleteSubmit()"
			[disabled]="disableButtonDuringRequest"
			>{{ localization.ok }}</ui5-button
		>
		<ui5-button
			design="Transparent"
			(click)="closeDialogDelete()"
			>{{ localization.close }}</ui5-button
		>
	</div>
</ui5-dialog>
