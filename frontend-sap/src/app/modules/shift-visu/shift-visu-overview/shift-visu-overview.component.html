<div class="grid grid-cols-1 sm:grid-cols-2 gap-1 lg:grid-cols-4 h-full shadow-lg rounded-lg">
	<div class="relative">
		<div>
			<ui5-card>
				<ui5-bar design="Header">
					<ui5-title
						slot="startContent"
						level="H5"
						size="H5">
						Total Issues
					</ui5-title>
				</ui5-bar>

				<div class="grid grid-cols-3 w-full text-center mt-2">
					<div class="flex flex-col">
						<span>Total Issues</span>
						<span class="text-sky-600 text-3xl">234</span>
					</div>

					<div class="flex flex-col">
						<span>Urgent</span>
						<span class="text-red-800 text-3xl">234</span>
					</div>

					<div class="flex flex-col">
						<span>Not Urgent</span>
						<span class="text-green-700 text-3xl">234</span>
					</div>
				</div>

				<div class="chart w-[95%] m-auto mt-2">
					<div
						#chartdiv
						class="w-full h-[250px] m-auto">
					</div>
				</div>
			</ui5-card>
		</div>

		<div class="h-[60%]">
			<ui5-card class="h-full">
				<ui5-bar design="Header">
					<ui5-title
						slot="startContent"
						level="H5"
						size="H5"
						>Issues responsible(29)
					</ui5-title>

					<ui5-button
						design="Transparent"
						slot="endContent"
						>20 of 23</ui5-button
					>
				</ui5-bar>

				<ui5-list
					separators="None"
					style="margin-block-end: 0.75rem">
					<ui5-li
						description="10210"
						additionalText="hello"
						style="
							--_ui5_listitem_padding: 0.25rem 0.5rem;
							--_ui5_listitem_description_fontsize: 0.75rem;
						"
						>Richard Wilson
						<ui5-avatar
							initials="XS"
							slot="image"
							color-scheme="Accent1"
							size="XS"></ui5-avatar>
					</ui5-li>
				</ui5-list>
			</ui5-card>
		</div>
	</div>

	<div class="card h-full grid grid-rows-4 gap-2 col-span-3">
		<div class="grid grid-cols-3 gap-1">
			<div>
				<ui5-card class="h-full">
					<ui5-bar design="Header">
						<ui5-title
							slot="startContent"
							level="H5"
							size="H5"
							>All Issues</ui5-title
						>
						<ui5-label
							design="Transparent"
							slot="endContent"
							>20.08.2024</ui5-label
						>
					</ui5-bar>

					<div class="p-4 space-y-4">
						<div
							class="flex items-center space-x-3"
							*ngFor="let items of issues; let i = index">
							<div class="w-28 text-sm font-medium">{{ items.label }}</div>
							<div class="flex-1 bg-gray-200 rounded h-2 overflow-hidden">
								<div
									[ngClass]="items.bgcolor"
									class="h-full"
									[style]="'width:' + items.percentage + '%'"></div>
							</div>
							<div
								[ngClass]="items.textcolor"
								class="w-10 text-sm font-semibold text-right"
								>{{ items.percentage }}%</div
							>
						</div>
					</div>
				</ui5-card>
			</div>
			<div class="col-span-2">
				<ui5-card class="h-full">
					<div
						#stockchart
						class="w-full h-[210px]">
					</div>
				</ui5-card>
			</div>
		</div>

		<div class="row-span-3 rounded overflow-hidden">
			<app-grid-table
				[headerTitle]="'All List'"
				[url]="'s'"
				[columns]="columns"
				[showAction]="true"
				[showSearch]="true"
				[showActiveButton]="true"
				[showTableSettingBtn]="true"
				i18n-addButtonText
				i18n-extraButtonText
				[showDatePicker]="true"
				datePickerFormat="YYYY-MM-dd"
				[showDownload]="true"
				button1Text="All"
				button2Text="Open"
				button3Text="Close"
				[showNewButton]="false"
				[addButtonDisable]="false"
				[showExtraButton]="false"
				[isBaseVisu]="false"
				[showDeleteButton]="false"
				[enableServerSideFiltering]="true"
				selectionMode="Single"></app-grid-table>
		</div>
	</div>
</div>
